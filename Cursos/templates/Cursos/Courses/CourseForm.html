<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<style>
    form{
        width: 70% !important;
        margin:  auto;
        
    }
    input,textarea{
        width: 80%;
        height: 30px;
        min-height: min-content !important;
        display: block;
        margin: auto;
        margin-top: 5px;
        margin-bottom: 5px;
        padding: 0.375rem 0.75rem;
        font-size: 1rem;
        font-weight: 400;
        line-height: 1.5;
        color: aliceblue;
        background-color: #212529;
        background-clip: padding-box;
        border: 1px solid #ced4da;
        border-radius: 0.25rem;
        transition: border-color 0.15s ease-in-out, box-shadow 0.15s ease-in-out;
    }

    .form-control,#id_name,#id_description,#id_start_date,#id_end_date{
        display: block;
        margin: auto;
        margin-top: 5px;
        margin-bottom: 5px;
        padding: 0.375rem 0.75rem;
        font-size: 1rem;
        font-weight: 400;
        line-height: 1.5;
        color: aliceblue;
        background-color: #212529;
        background-clip: padding-box;
        border: 1px solid #ced4da;
        border-radius: 0.25rem;
        transition: border-color 0.15s ease-in-out, box-shadow 0.15s ease-in-out;
      }
      
      .form-control,input:focus,textarea:focus {
        color: #495057;
        background-color: #fff;
        border-color: #80bdff;
        outline: 0;
        box-shadow: 0 0 0 0.2rem rgba(0, 123, 255, 0.25);
      }
      #enter,#reset{
        width: 30% !important;
        margin-top: 10px;
        margin-bottom: 10px;
      }
      #id_name,#id_start_date,#id_end_date{
        width: 80% !important;
      }
</style>
    {% load static %}
    <link rel="stylesheet" href="{% static 'Cursos/css/bootstrap.min.css' %}">
</head>
{% include "Cursos/header.html" %}
<a href="{% url 'courses' %}" class=" btn btn-secondary btn-sm float-end m-2">Ir a atras</a>
<body class="text-center bg-dark text-light">
    <div class="container">
        <div class="row">
            <div class="col-12 col-md-6 offset-md-3">
                
                        <h2>Ingrese los datos requeridos</h2>
                        <hr>
                        <form action="" method="post" class="form-control bg-dark text-light p-3">
                            {% csrf_token %}
                            {{form}}
                            <input type="reset" value="Cancelar" id="reset" class="btn btn-secondary">
                            <input type="submit" value="Entrar" id="enter" class="btn btn-primary">
                        </form>

                   
            </div>
        </div>

    </div>
    <script>
        $('textarea').on('input', function () {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
          });
          
    </script>
    <script src="{% static 'Cursos/js/bootstrap.min.js' %}"></script>
</body>
</html>
