<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cargar foto del estudiante</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'Cursos/css/bootstrap.min.css' %}">
</head>
<body class="container text-center bg-dark text-light">
    <a href="{% url 'studentDetails' estudiante.id %}" class="btn btn-secondary float-end mx-3 btn-sm">Ir atrás</a>
    <main class="mx-auto mt-5" style="max-width: 520px;">
        <h4>Cargar foto de {{ estudiante }}</h4>
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form.picture }}
            {{ form.picture.errors }}
            <button type="submit" class="btn btn-success mt-3">Guardar foto</button>
        </form>
    </main>
</body>
</html>
