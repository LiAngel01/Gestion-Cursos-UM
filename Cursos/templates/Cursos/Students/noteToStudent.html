<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    {% load static  %}
    <link rel="stylesheet" href="{% static 'Cursos/css/bootstrap.min.css' %}">
    
    <link rel="stylesheet" href="{% static 'Cursos/fonts/ionicons.min.css' %}">
    <style>
    label{
        margin: auto

    }
    input{
        margin: auto;
    }
   .card{
        width: 100% !important;
        margin: auto !important;
        margin-top: 100px !important;
    }
    textarea{
        width: 90%;
        min-height: min-content;
        height: 50px;
        resize: vertical;
        max-height: min-content;
        padding:5px;

    }
    #id_firstName,#id_note,#id_valoracion,#id_tval{
        display: block;
        margin-left: auto;
        margin-right: auto;
        width: 70%;
        margin-top: 0px;
        margin-bottom: 3px;
        padding: 0.375rem 0.75rem;
        font-size: 1rem;
        font-weight: 400;
        line-height: 1.5;
        color: aliceblue;
        background-color: #212529;
        background-clip: padding-box;
        border: 1px solid #ced4da;
        border-radius: 0.25rem;
        transition: border-color 0.15s ease-in-out, box-shadow 0.15s ease-in-out;
      }
      
      .form-control,input:focus,textarea:focus {
        color: #495057;
        background-color: #fff;
        border-color: #80bdff;
        outline: 0;
        box-shadow: 0 0 0 0.2rem rgba(0, 123, 255, 0.25);
      }
    textarea{
    
    min-height: min-content;
    height: 35px;
    resize: vertical;
    
    padding:5px;

}

   </style>
</head>
<body class="text-center bg-dark text-light">
    <div class="container">
        <div class="row">
            <div class="col-12 col-md-6 offset-md-3">
                
                        <h2>Valoracion de:</h2>

                        {{student}} en {{course}}
                        

                        <hr>
                        <form action="" method="post" class="form-control bg-dark text-light">
                            {% csrf_token %}
                            {{form}}
                            <a href="{% url 'studentDetails' student.id %}" class="btn btn-secondary  btn-sm">Volver atras</a>
                            <button type="reset" class="btn btn-secondary btn-sm" style="width:40px"> <i class="icon ion-ios-undo" style="font-size: 14px;  "> </i></button>
                            <input type="submit" value="Entrar" class="btn btn-primary btn-sm my-2 ">
                        </form>

                        {% if messages %}
                        <div class="messages">
                            {% for message in messages %}
                                <div{% if message.tags %} class="alert alert-{{ message.tags }}"{% endif %}>
                                    {{ message }}
                                </div>
                            {% endfor %}
                        </div>
                    {% endif %}
                     
            </div>
        </div>

    </div>
</body>
</html>
