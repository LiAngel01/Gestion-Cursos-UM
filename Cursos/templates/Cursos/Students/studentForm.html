<body class=" bg-dark text-light">

  <section class="text-center mx-3"> 
     <h3>Introducir Datos</h3>
    <form action="{% url 'newStudent' %}" method="post" class="form-control  mx-auto mt-5  bg-dark text-light" enctype="multipart/form-data">
      {% csrf_token %}
    <div class="row mx-auto ">
      <div class="col-md-4  text-center">
      <div class="row">
        <label for="">NOMBRE: </label>
        <div>{{form.firstName}}</div>
      </div>
      <div class="row"> <label for="">UNIDAD MILITAR  : </label>
        <div>{{form.MU}}</div></div>
      <div class="row"> <label for="">CI: </label>
        <div>{{form.CI}}</div></div>
        <div class="row"> <label for="">NIVEL ESCOLAR: </label>
          <div>{{form.nivelEscolar}}</div></div>
    </div>
    

      <div class="col-md-4  text-center">
        <div class="row">
        <label for="">PRIMER APELLIDO: </label>
        <div>{{form.lastName}}</div>
      </div>
      <div class="row"> 
        <label for="">UNIDAD MENOR: </label>
        <div>{{form.MUI}}</div></div>
      <div class="row"> <label for="">TOMO: </label>
        <div>{{form.tomo}}</div></div>
      
        <div class="row"> <label for="">TELEFONO: </label>
          <div>{{form.telefono}}</div></div>
      </div>


      <div class="col-md-4  text-center">
        <div class="row">
        <label for="">SEGUNDO APELLIDO: </label>
        <div>{{form.seclastName}}</div>
      </div>

      <div class="row"> <label for="">GRADO: </label>
        <div>{{form.grado}}</div></div>
      <div class="row"> <label for="">FOLIO: </label>
       <div> {{form.folio}}</div>
      </div>
      <div class="row"> <label for="">CURSO: </label>
       <div> {{formM}}</div>
      </div>

    


    </div>


    <div class="my-3 text-center">
      <a href="{% url 'showStudents' %}" class=" btn btn-secondary btn-sm">Ir a atras</a>
    <input type="submit" value="Tomar Foto y Guardar" class="btn btn-primary btn-sm">
    </div>

  </form>
  </section>

<script>
    addEventListener("load", showCamera());

    function showCamera() {
        // Mostrar el contenedor de la cámara
        var cameraContainer = document.getElementById('camera-container');
        cameraContainer.style.display = 'block';

        // Acceder a la cámara y mostrar la imagen en el video
        navigator.mediaDevices.getUserMedia({ video: true })
            .then(function(stream) {
                var video = document.getElementById('camera-video');
                video.srcObject = stream;
                video.play();
            })
            .catch(function(error) {
                console.error('Error al acceder a la cámara:', error);
            });
    }
    // Agrega este código al final de tu script
const cameraVideo = document.getElementById('camera-video');

document.querySelector('form').addEventListener('submit', function() {
  if (cameraVideo.srcObject) {
    cameraVideo.srcObject.getTracks().forEach(track => track.stop());
  }
});

</script>
