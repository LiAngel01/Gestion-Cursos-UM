<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'Cursos/css/bootstrap.min.css' %}">


    <style>
        #id_Course{
         
            
             width: 100%;
             height: 30px;
             padding: 0.375rem 0.75rem;
             font-size: 1rem;
             font-weight: 400;
             line-height: 1.5;
             color: #495057;
             background-color: #212529;
             background-clip: padding-box;
             border: 1px solid #ced4da;
             border-radius: 0.25rem;
             transition: border-color 0.15s ease-in-out, box-shadow 0.15s ease-in-out;
             color: aliceblue;
           }
    </style>

</head>

<body class="text-center bg-dark text-light">
    <div class="container">
        <div class="row">
            <div class="col-12 col-md-6 offset-md-3">
                <div class=" m-3 ">
                    <div class=" bg-dark text-light">
                        
                        <form action="" method="post" class="form-control bg-dark text-light">
                         <h2>Seleccione el Curso para matricular a: </h2>
                        <h5>{{student.firstName}} {{student.lastName}} {{student.seclastName}} </h5>
                        <hr>
                            {% csrf_token %}
                            {{form}}
                            <input type="submit" class="btn btn-primary btn-sm" value="Entrar">
                        </form>

                    </div>
                </div>
            </div>
        </div>

    </div>
</body>
<script src="{% static 'Cursos/js/bootstrap.min.js' %}"></script>
</html>
